<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Figma Canvas Writer 2</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; background: var(--figma-color-bg,#fff); color: var(--figma-color-text,#1f1f1f); }
  .panelTitle { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  #statusRow { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .dot.ok { background: #159447; } .dot.bad { background: #d83232; } .dot.warn { background: #e9a323; }
  #statusText { font-weight: 600; }
  #detail { line-height: 1.45; min-height: 32px; margin-bottom: 8px; overflow-wrap: anywhere; }
  label { display: block; margin-bottom: 5px; }
  input { width: 100%; padding: 7px; border: 1px solid #aaa; border-radius: 4px; background: var(--figma-color-bg,#fff); color: inherit; }
  button { padding: 7px 8px; margin-top: 8px; border: 0; border-radius: 4px; cursor: pointer; background: #0d77d9; color: #fff; }
  #pairBtn { width: 100%; }
  .actions { display: flex; gap: 6px; } .actions button { flex: 1; }
  .hint { margin-top: 8px; font-size: 11px; line-height: 1.4; opacity: .7; }
</style>
</head>
<body>
<div class="panelTitle">Figma Canvas Writer 2</div>
<div id="statusRow"><span id="dot" class="dot"></span><span id="statusText">初始化…</span></div>
<div id="detail"></div>
<div id="pairArea">
  <label for="pair">本机配对密钥</label>
  <input id="pair" type="password" maxlength="64" autocomplete="off" spellcheck="false" placeholder="粘贴本机终端显示的 64 位十六进制密钥" />
  <button id="pairBtn">保存配对并连接</button>
</div>
<div class="actions"><button id="connectBtn">连接</button><button id="disconnectBtn">断开</button><button id="forgetBtn">忘记配对</button></div>
<div class="hint">在本机终端运行 node bridge/mcp-bridge.js --show-pairing-key 查看密钥。密钥仅保存在本机，不通过网络发送。</div>
<script>
// Separate bootstrap: report main-script parse/startup failures without exposing payloads.
(function () {
  function report(message) {
    var status = document.getElementById('statusText');
    var detail = document.getElementById('detail');
    var dot = document.getElementById('dot');
    var safe = String(message || 'UI 启动失败').replace(/[0-9a-f]{64}/gi, '[已隐藏]').slice(0, 500);
    if (status) status.textContent = '启动失败';
    if (detail) detail.textContent = safe;
    if (dot) dot.className = 'dot bad';
  }
  window.addEventListener('error', function (event) { report(event.message || 'UI 脚本执行失败'); });
  window.addEventListener('unhandledrejection', function (event) {
    report(event.reason && typeof event.reason.message === 'string' ? event.reason.message : 'UI 发生未处理的异步错误');
  });
})();
</script>

<script>
'use strict';
const BRIDGE_URL = 'ws://localhost:9753/plugin';
const PROTOCOL = 2;
const DOMAIN = 'figma-canvas-writer/v2';
const HEX64 = /^[0-9a-f]{64}$/i;
const MAX_MSG_BYTES = 256 * 1024;
const encoder = new TextEncoder();
let token = '';
let cryptoKey = null;
let context = null;
let connection = null;
let generation = 0;
let keyRevision = 0;
let wantConnected = true;
let userTouchedKey = false;
let pendingSave = false;
let reconnectTimer = null;
let reconnectDelay = 1000;
const executions = new Map();

function plain(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
function canonical(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(x => x === undefined ? 'null' : canonical(x)).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canonical(v[k])).join(',') + '}';
}
function normalizeContext(v) {
  if (!plain(v)) throw new Error('尚未取得 Figma 页面上下文');
  const out = {};
  for (const k of ['sessionId', 'pageId', 'pageName', 'fileName']) {
    if (typeof v[k] !== 'string' || v[k].length > 1024 || ((k === 'sessionId' || k === 'pageId') && !v[k])) throw new Error('页面上下文不合法');
    out[k] = v[k];
  }
  if (v.editorType !== undefined) {
    if (v.editorType !== 'figma') throw new Error('仅支持 Figma Design 文件');
    out.editorType = v.editorType;
  }
  return out;
}
function authProof(kind, serverNonce, clientNonce, ctx, connectionId) {
  return { domain: DOMAIN, kind, protocol: PROTOCOL, serverNonce, clientNonce, context: ctx, ...(connectionId === undefined ? {} : { connectionId }) };
}
function frameProof(direction, connectionId, seq, payload) {
  return { domain: DOMAIN, kind: direction + '-frame', connectionId, seq, payload };
}
function hex(bytes) { return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(''); }
function unhex(s) { return new Uint8Array(s.match(/../g).map(x => parseInt(x, 16))); }
function macBytes(key, value) {
  const digest = window.FCWCrypto.hmacSha256(key, encoder.encode(canonical(value)));

}
function toMain(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }
function setState(state, detail) {
  const states = { idle: '已断开', waiting: '等待配对', connecting: '连接中…', connected: '正在验证本机桥接…', authorized: '已授权', auth_failed: '连接未获授权', disconnected: '已断开，等待重连…' };
  document.getElementById('statusText').textContent = states[state] || state;
  document.getElementById('detail').textContent = detail || '';
  document.getElementById('dot').className = 'dot' + (state === 'authorized' ? ' ok' : state === 'auth_failed' ? ' bad' : state === 'connecting' || state === 'connected' ? ' warn' : '');
}
function showPair(show) { document.getElementById('pairArea').style.display = show ? '' : 'none'; }
function current(c) { return connection === c && c.generation === generation && wantConnected; }
function clearReconnect() { if (reconnectTimer) clearTimeout(reconnectTimer); reconnectTimer = null; }
function detach(reason) {

  generation++;

function stop(reason, revoke) {
  wantConnected = false;
  detach(reason);
  if (revoke) toMain({ type: 'revoke' });
}
function fail(c, message) {
  if (!current(c)) return;
  stop('auth failure', false);
  setState('auth_failed', message);

}

  if (!wantConnected || reconnectTimer || !cryptoKey || !context) return;

  if (typeof globalThis.crypto?.getRandomValues !== 'function') throw new Error('当前环境缺少安全随机数，已拒绝建立连接');
  if (typeof window.FCWCrypto?.hmacSha256 !== 'function' || typeof window.FCWCrypto?.equalBytes !== 'function') throw new Error('本地签名组件未加载，请重新导入完整插件');

  pendingSave = save;

  if (!context) { setState('waiting', '等待当前 Figma 页面信息'); return; }
  if (!cryptoKey) { setState('waiting', '请先粘贴本机配对密钥'); showPair(true); return; }
  clearReconnect();
  const c = {
    generation: ++generation, key: cryptoKey, context: { ...context }, authed: false,

  c.authTimer = setTimeout(() => fail(c, '本机桥接未完成双向验证，请确认桥接正在运行'), 10000);

    c.receiveQueue = c.receiveQueue.then(async () => {
      if (!current(c)) return;
      if (typeof ev.data !== 'string' || encoder.encode(ev.data).length > MAX_MSG_BYTES) throw new Error('桥接消息过大或格式不合法');
      const msg = JSON.parse(ev.data);
      if (!plain(msg)) throw new Error('桥接消息不合法');
      if (!c.authed) {
        if (msg.type === 'challenge' && !c.serverNonce) {
          if (msg.protocol !== PROTOCOL || typeof msg.serverNonce !== 'string' || !HEX64.test(msg.serverNonce)) throw new Error('桥接协议不匹配');
          c.serverNonce = msg.serverNonce;
          c.clientNonce = hex(crypto.getRandomValues(new Uint8Array(32)));
          const proof = await sign(c.key, authProof('client-auth', c.serverNonce, c.clientNonce, c.context));
          if (current(c) && c.ws.readyState === 1) c.ws.send(JSON.stringify({ type: 'auth', protocol: PROTOCOL, serverNonce: c.serverNonce, clientNonce: c.clientNonce, context: c.context, proof }));
          return;
        }
        if (msg.type === 'auth_ack' && c.serverNonce) {
          if (msg.ok !== true) throw new Error(msg.error?.code === 'PLUGIN_BUSY' ? '另一个插件已连接，请先断开该插件，再点击连接' : '密钥验证失败，请核对本机配对密钥');
          if (msg.protocol !== PROTOCOL || typeof msg.connectionId !== 'string' || !HEX64.test(msg.connectionId) ||
              !await verify(c.key, authProof('server-auth', c.serverNonce, c.clientNonce, c.context, msg.connectionId), msg.proof)) throw new Error('无法验证桥接身份，已拒绝连接');
          if (!current(c)) return;
          c.connectionId = msg.connectionId;
          c.authed = true;
          clearTimeout(c.authTimer);
          reconnectDelay = 1000;
          setState('authorized', c.context.fileName + ' / ' + c.context.pageName);
          showPair(false);
          if (pendingSave) { pendingSave = false; toMain({ type: 'saveToken', token }); }

      if (!current(c) || !c.authed) return;
      c.recvSeq = msg.seq;
      const p = msg.payload;
      if (p.type !== 'cmd' || typeof p.id !== 'string' || !p.id ||
          p.sessionId !== c.context.sessionId || p.pageId !== c.context.pageId ||
          typeof p.command !== 'string' || !plain(p.params) || executions.has(p.id) ||
          Object.keys(p).some(k => !['type', 'id', 'sessionId', 'pageId', 'operationId', 'command', 'params'].includes(k))) throw new Error('命令目标或格式不合法');
      if (['createNode', 'modifyNode', 'deleteNode', 'setText'].includes(p.command) &&
          (typeof p.operationId !== 'string' || !p.operationId || p.operationId.length > 128)) throw new Error('写入缺少 operationId');
      if (executions.size >= 100) throw new Error('在途命令数量过多');
      executions.set(p.id, c);
      toMain({ type: 'exec', id: p.id, sessionId: p.sessionId, pageId: p.pageId,
        ...(p.operationId === undefined ? {} : { operationId: p.operationId }), command: p.command, params: p.params });
    }).catch(e => fail(c, e.message));
  };
  c.ws.onerror = () => {};
  c.ws.onclose = () => {
    clearTimeout(c.authTimer);
    if (connection !== c) return;
    connection = null;
    generation++;
    executions.clear();
    c.authed = false;
    if (wantConnected) { setState('disconnected', '桥接断开；写入超时后请查询原 operationId'); scheduleReconnect(); }
  };
}
function sendResult(msg) {
  const c = executions.get(msg.id);
  executions.delete(msg.id);
  if (!c || !current(c) || !c.authed || c.ws.readyState !== 1) return;
  c.sendQueue = c.sendQueue.then(async () => {
    if (!current(c) || !c.authed || c.ws.readyState !== 1) return;
    const payload = msg.ok === true
      ? { type: 'resp', id: msg.id, ok: true, data: msg.data === undefined ? null : msg.data }
      : { type: 'resp', id: msg.id, ok: false, error: msg.error || { code: 'PLUGIN_ERROR', message: '插件未提供错误详情' } };
    const seq = ++c.sendSeq;
    const frame = { type: 'frame', connectionId: c.connectionId, seq, payload,
      mac: await sign(c.key, frameProof('client', c.connectionId, seq, payload)) };
    const text = JSON.stringify(frame);
    if (encoder.encode(text).length > MAX_MSG_BYTES) throw new Error('插件结果超过 256KB，请缩小读取范围并查询在途写入状态');
    if (current(c) && c.authed && c.ws.readyState === 1) c.ws.send(text);
  }).catch(e => fail(c, e.message));
}

window.onmessage = event => {
  // Figma Desktop dispatches Plugin API messages from its top-level editor window.
  if (event.source !== window.top || !['https://www.figma.com', 'https://figma.com'].includes(event.origin)) return;
  const msg = event.data?.pluginMessage;
  if (!plain(msg)) return;
  if (msg.type === 'exec_result') { sendResult(msg); return; }
  if (msg.type === 'init' || msg.type === 'context') {
    try {
      const next = normalizeContext(msg.context);
      const changed = context && canonical(context) !== canonical(next);
      context = next;
      if (changed) detach('context changed');
      if (wantConnected) connect();
    } catch (e) { stop('invalid context', false); setState('auth_failed', e.message); }
    return;
  }
  if (msg.type === 'token') {
    if (userTouchedKey) return;
    if (typeof msg.token === 'string' && msg.token) {
      setKey(msg.token, false).catch(e => { setState('auth_failed', e.message); showPair(true); });
    } else { showPair(true); setState('waiting', '粘贴本机配对密钥后连接'); }
    return;
  }
  if (msg.type === 'saved' && msg.ok !== true) setState('authorized', '本次连接已授权，但保存配对失败；下次需重新粘贴密钥');
  if (msg.type === 'tokenCleared') {
    if (msg.ok === false) setState('auth_failed', '已断开，但清除已保存配对失败，请重试忘记配对');
    else setState('waiting', '已忘记配对；粘贴新的本机密钥后连接');
  }
};
document.getElementById('pairBtn').addEventListener('click', () => {
  userTouchedKey = true;
  const value = document.getElementById('pair').value.trim();
  document.getElementById('pair').value = '';
  detach('new pairing');
  wantConnected = true;
  setKey(value, true).catch(e => { wantConnected = false; setState('auth_failed', e.message); showPair(true); });
});
document.getElementById('connectBtn').addEventListener('click', () => {
  wantConnected = true;
  reconnectDelay = 1000;
  connect();
});
document.getElementById('disconnectBtn').addEventListener('click', () => {
  stop('user disconnect', true);
  setState('idle', '已停止本次授权；点击连接可重新授权');
});
document.getElementById('forgetBtn').addEventListener('click', () => {
  userTouchedKey = true;
  ++keyRevision;
  stop('forget pairing', true);
  token = ''; cryptoKey = null; pendingSave = false;
  document.getElementById('pair').value = '';
  showPair(true);
  toMain({ type: 'clearToken' });
  setState('waiting', '已断开，正在清除已保存配对');
});
toMain({ type: 'getToken' });
</script>
</body>
