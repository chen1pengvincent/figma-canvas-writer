<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Figma Canvas Writer 3</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; background: var(--figma-color-bg,#fff); color: var(--figma-color-text,#1f1f1f); }
  .panelTitle { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  #statusRow { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .dot.ok { background: #159447; } .dot.bad { background: #d83232; } .dot.warn { background: #e9a323; }
  #statusText { font-weight: 600; }
  #detail { line-height: 1.45; min-height: 32px; margin-bottom: 8px; overflow-wrap: anywhere; }
  label { display: block; margin-bottom: 5px; }
  input { width: 100%; padding: 7px; border: 1px solid #aaa; border-radius: 4px; background: var(--figma-color-bg,#fff); color: inherit; }
  button { padding: 7px 8px; margin-top: 8px; border: 0; border-radius: 4px; cursor: pointer; background: #0d77d9; color: #fff; }
  #pairBtn { width: 100%; }
  .actions { display: flex; gap: 6px; } .actions button { flex: 1; }
  .hint { margin-top: 8px; font-size: 11px; line-height: 1.4; opacity: .7; }
</style>
</head>
<body>
<div class="panelTitle">Figma Canvas Writer 3</div>
<div id="statusRow"><span id="dot" class="dot"></span><span id="statusText">初始化…</span></div>
<div id="detail"></div>
<div id="pairArea">
  <label for="pair">本机配对密钥</label>
  <input id="pair" type="password" maxlength="64" autocomplete="off" spellcheck="false" placeholder="粘贴本机终端显示的 64 位十六进制密钥" />
  <button id="pairBtn">保存配对并连接</button>
</div>
<div class="actions"><button id="connectBtn">连接</button><button id="disconnectBtn">断开</button><button id="forgetBtn">忘记配对</button></div>
<div class="hint">在本机终端运行 node bridge/mcp-bridge.js --show-pairing-key 查看密钥。密钥仅保存在本机，不通过网络发送。</div>
<script>
// Separate bootstrap: report main-script parse/startup failures without exposing payloads.
(function () {
  function report(message) {
    var status = document.getElementById('statusText');
    var detail = document.getElementById('detail');
    var dot = document.getElementById('dot');
    var safe = String(message || 'UI 启动失败').replace(/[0-9a-f]{64}/gi, '[已隐藏]').slice(0, 500);
    if (status) status.textContent = '启动失败';
    if (detail) detail.textContent = safe;
    if (dot) dot.className = 'dot bad';
  }
  window.addEventListener('error', function (event) { report(event.message || 'UI 脚本执行失败'); });
  window.addEventListener('unhandledrejection', function (event) {
    report(event.reason && typeof event.reason.message === 'string' ? event.reason.message : 'UI 发生未处理的异步错误');
  });
})();
</script>

  document.getElementById('detail').textContent = detail || '';

    c.authed = false;

  clearReconnect();
  const c = {
    generation: ++generation, key: cryptoKey, context: { ...context }, authed: false,
    serverNonce: null, clientNonce: null, connectionId: null, recvSeq: 0, sendSeq: 0,
    receiveQueue: Promise.resolve(), sendQueue: Promise.resolve(), transferTimers: {},
  };
  connection = c;
  setState('connecting', context.fileName + ' / ' + context.pageName);
  try { c.ws = new WebSocket(BRIDGE_URL); } catch (e) { connection = null; setState('disconnected', e.message); scheduleReconnect(); return; }
  c.authTimer = setTimeout(() => fail(c, '本机桥接未完成双向验证，请确认桥接正在运行'), 10000);
  c.ws.onopen = () => { if (current(c)) setState('connected', 'WebSocket 已连接，等待桥接握手（10 秒超时）…'); };
  c.ws.onmessage = ev => {
    c.receiveQueue = c.receiveQueue.then(async () => {
      if (!current(c)) return;
      if (typeof ev.data !== 'string' || encoder.encode(ev.data).length > MAX_MSG_BYTES) throw new Error('桥接消息过大或格式不合法');
      const msg = JSON.parse(ev.data);
      if (!plain(msg)) throw new Error('桥接消息不合法');
      if (!c.authed) {
        if (msg.type === 'challenge' && !c.serverNonce) {
          if (msg.protocol !== PROTOCOL || typeof msg.serverNonce !== 'string' || !HEX64.test(msg.serverNonce)) {
            throw new Error('桥接协议不匹配：对端为协议 ' + (typeof msg.protocol === 'number' ? msg.protocol : '未知（可能不是本项目的桥）') +
              '，插件需要协议 ' + PROTOCOL + '。请升级桥接与插件到同一版本，或运行 node scripts/doctor.mjs 检查 9753 占用者');
          }
          c.serverNonce = msg.serverNonce;
          c.clientNonce = hex(crypto.getRandomValues(new Uint8Array(32)));
          const proof = await sign(c.key, authProof('client-auth', c.serverNonce, c.clientNonce, c.context));
          if (current(c) && c.ws.readyState === 1) c.ws.send(JSON.stringify({ type: 'auth', protocol: PROTOCOL, serverNonce: c.serverNonce, clientNonce: c.clientNonce, context: c.context, proof }));
          return;
        }
        if (msg.type === 'auth_ack' && c.serverNonce) {
          if (msg.ok !== true) throw new Error(msg.error?.code === 'PLUGIN_BUSY' ? '另一个插件已连接，请先断开该插件，再点击连接' : '密钥验证失败，请核对本机配对密钥');
          if (msg.protocol !== PROTOCOL || typeof msg.connectionId !== 'string' || !HEX64.test(msg.connectionId) ||
              !await verify(c.key, authProof('server-auth', c.serverNonce, c.clientNonce, c.context, msg.connectionId), msg.proof)) throw new Error('无法验证桥接身份，已拒绝连接');
          if (!current(c)) return;
          c.connectionId = msg.connectionId;
          c.authed = true;
          clearTimeout(c.authTimer);
          reconnectDelay = 1000;
          setState('authorized', c.context.fileName + ' / ' + c.context.pageName);
          showPair(false);
          if (pendingSave) { pendingSave = false; toMain({ type: 'saveToken', token }); }
          return;
        }
        throw new Error('收到鉴权前命令或非法握手，已拒绝连接');
      }
      if (msg.type !== 'frame' || msg.connectionId !== c.connectionId || !Number.isSafeInteger(msg.seq) ||
          msg.seq !== c.recvSeq + 1 || !plain(msg.payload) ||
          !await verify(c.key, frameProof('server', msg.connectionId, msg.seq, msg.payload), msg.mac)) throw new Error('命令签名或序号无效，已断开连接');
      if (!current(c) || !c.authed) return;
      c.recvSeq = msg.seq;
      const p = msg.payload;
      if (p.type === 'chunk') {
        await receiveChunk(c, p);
        return;
      }
      if (p.type === 'chunk_ack') {
        receiveChunkAck(c, p);
        return;
      }
      if (p.type !== 'cmd' || typeof p.id !== 'string' || !p.id ||
          p.sessionId !== c.context.sessionId || p.pageId !== c.context.pageId ||
          p.pageRevision !== c.context.pageRevision ||
          typeof p.command !== 'string' || !plain(p.params) || executions.has(p.id) ||
          Object.keys(p).some(k => !['type', 'id', 'sessionId', 'pageId', 'pageRevision', 'operationId', 'command', 'params'].includes(k))) throw new Error('命令目标或格式不合法');
      if (executions.size >= 100) throw new Error('在途命令数量过多');
      if (p.command === 'importAsset') {
        if (typeof p.operationId !== 'string' || !p.operationId || p.operationId.length > 128) throw new Error('导入缺少 operationId');
        if (typeof p.params.transferId !== 'string' || typeof p.params.totalBytes !== 'number' || typeof p.params.totalSha256 !== 'string') throw new Error('导入传输参数不合法');
        if (pendingImport) throw new Error('已有未完成的导入传输');
        pendingImport = {
          id: p.id, sessionId: p.sessionId, pageId: p.pageId, pageRevision: p.pageRevision,
          operationId: p.operationId, params: { ...p.params },
          transferId: p.params.transferId, totalBytes: p.params.totalBytes, totalSha256: p.params.totalSha256,
          chunks: [], received: 0, nextIndex: 0,
        };
        c.transferTimers['import-' + p.id] = setTimeout(() => { if (pendingImport && pendingImport.id === p.id) { pendingImport = null; fail(c, '导入传输无进展'); } }, TRANSFER_IDLE_MS);
        return;
      }
      executions.set(p.id, c);
      toMain({ type: 'exec', id: p.id, sessionId: p.sessionId, pageId: p.pageId, pageRevision: p.pageRevision,
        ...(p.operationId === undefined ? {} : { operationId: p.operationId }), command: p.command, params: p.params });
    }).catch(e => fail(c, e.message));
  };
  c.ws.onerror = () => {};
  c.ws.onclose = () => {
    clearTimeout(c.authTimer);
    if (connection !== c) return;
    connection = null;
    generation++;
    executions.clear();
    outTransfers.clear();
    pendingImport = null;
    c.authed = false;
    if (wantConnected) { setState('disconnected', '桥接断开；写入超时后请查询原 operationId'); scheduleReconnect(); }
  };
}

// ---- inbound chunks (bridge -> plugin, import only) ------------------------
async function receiveChunk(c, p) {
  if (!pendingImport) throw new Error('收到未声明的分块');
  if (p.transferId !== pendingImport.transferId) throw new Error('分块属于其他传输');
  if (p.index !== pendingImport.nextIndex) throw new Error('分块乱序，已断开');
  if (typeof p.data !== 'string') throw new Error('分块数据不合法');
  const bytes = base64ToBytes(p.data);
  if (bytes.length > CHUNK_RAW_BYTES) throw new Error('分块超过 64KiB');
  pendingImport.received += bytes.length;
  if (pendingImport.received > RESOURCE_BYTES) throw new Error('导入资源超过 16MiB');
  pendingImport.chunks.push(bytes);
  pendingImport.nextIndex++;
  clearTimeout(c.transferTimers['import-' + pendingImport.id]);
  c.transferTimers['import-' + pendingImport.id] = setTimeout(() => { if (pendingImport) { pendingImport = null; fail(c, '导入传输无进展'); } }, TRANSFER_IDLE_MS);
  await sendSigned(c, { type: 'chunk_ack', transferId: p.transferId, index: p.index });
  if (p.done !== true) return;
  const raw = concatBytes(pendingImport.chunks);
  if (raw.length !== pendingImport.totalBytes) throw new Error('导入资源字节数不符');
  if (sha256HexOf(raw) !== pendingImport.totalSha256) throw new Error('导入资源哈希不符');
  const pending = pendingImport;
  pendingImport = null;
  clearTimeout(c.transferTimers['import-' + pending.id]);
  if (!executions.has(pending.id)) {
    executions.set(pending.id, c);
    toMain({ type: 'import_asset_request', id: pending.id, sessionId: pending.sessionId, pageId: pending.pageId,
      pageRevision: pending.pageRevision, operationId: pending.operationId,
      params: { ...pending.params, assetBase64: bytesToBase64(raw) } });
  }
}

// ---- outbound chunks (plugin -> bridge, export/upload) ---------------------
function startUpload(c, msg) {
  if (!msg.transferId || typeof msg.data !== 'string') throw new Error('上传参数不合法');
  const raw = base64ToBytes(msg.data);
  if (raw.length !== msg.totalBytes) throw new Error('上传字节数不符');
  if (raw.length > RESOURCE_BYTES) throw new Error('上传资源超过 16MiB');
  const chunkCount = raw.length === 0 ? 1 : Math.ceil(raw.length / CHUNK_RAW_BYTES);
  const transfer = {
    id: msg.id, transferId: msg.transferId, operationId: msg.operationId || null,
    totalBytes: raw.length, sha: sha256HexOf(raw), chunkCount,
    chunks: [], sent: 0, unacked: new Set(), finished: false,
  };
  for (let index = 0; index < chunkCount; index++) {
    const slice = raw.subarray(index * CHUNK_RAW_BYTES, Math.min((index + 1) * CHUNK_RAW_BYTES, raw.length));
    transfer.chunks.push(slice);
  }
  outTransfers.set(msg.transferId, transfer);
  c.transferTimers['out-' + msg.transferId] = setTimeout(() => {
    const t = outTransfers.get(msg.transferId);
    if (t && !t.finished) { outTransfers.delete(msg.transferId); toMain({ type: 'transfer_upload_done', id: t.id, ok: false, error: '上传传输无进展' }); }
  }, TRANSFER_IDLE_MS);
  pumpOutbound(c, transfer);
}
function pumpOutbound(c, transfer) {
  if (!current(c) || !c.authed || c.ws.readyState !== 1) return;
  while (transfer.sent < transfer.chunkCount && transfer.unacked.size < UNACKED_CHUNKS) {
    const index = transfer.sent++;
    const isLast = index === transfer.chunkCount - 1;
    const payload = {
      type: 'chunk', transferId: transfer.transferId, index, done: isLast,
      data: bytesToBase64(transfer.chunks[index]),
      ...(index === 0 ? { operationId: transfer.operationId, totalBytes: transfer.totalBytes, totalSha256: transfer.sha } : {}),
    };
    transfer.unacked.add(index);
    sendSigned(c, payload).catch(() => {});
    if (index === 0) {
      c.transferTimers['total-' + transfer.transferId] = setTimeout(() => {
        const t = outTransfers.get(transfer.transferId);
        if (t && !t.finished) { outTransfers.delete(transfer.transferId); toMain({ type: 'transfer_upload_done', id: t.id, ok: false, error: '上传传输总时长超限' }); }
      }, TRANSFER_TOTAL_MS);
    }
  }
  if (transfer.sent === transfer.chunkCount && transfer.unacked.size === 0 && !transfer.finished) {
    transfer.finished = true;
    outTransfers.delete(transfer.transferId);
    clearTimeout(c.transferTimers['out-' + transfer.transferId]);
    clearTimeout(c.transferTimers['total-' + transfer.transferId]);
    toMain({ type: 'transfer_upload_done', id: transfer.id, ok: true });
  }
}
function receiveChunkAck(c, p) {
  const transfer = outTransfers.get(p.transferId);
  if (!transfer) return;
  if (typeof p.index !== 'number' || !Number.isSafeInteger(p.index)) throw new Error('上传确认序号非法');
  if (!transfer.unacked.has(p.index)) return;
  transfer.unacked.delete(p.index);
  clearTimeout(c.transferTimers['out-' + transfer.transferId]);
  c.transferTimers['out-' + transfer.transferId] = setTimeout(() => {
    const t = outTransfers.get(transfer.transferId);
    if (t && !t.finished) { outTransfers.delete(transfer.transferId); toMain({ type: 'transfer_upload_done', id: t.id, ok: false, error: '上传传输无进展' }); }
  }, TRANSFER_IDLE_MS);
  pumpOutbound(c, transfer);
}
async function sendSigned(c, payload) {
  await c.sendQueue;
  return new Promise((resolve, reject) => {
    c.sendQueue = (async () => {
      if (!current(c) || !c.authed || c.ws.readyState !== 1) { reject(new Error('连接不可用')); return; }
      try {
        const seq = ++c.sendSeq;
        const frame = { type: 'frame', connectionId: c.connectionId, seq, payload,
          mac: await sign(c.key, frameProof('client', c.connectionId, seq, payload)) };
        const text = JSON.stringify(frame);
        if (encoder.encode(text).length > MAX_MSG_BYTES) throw new Error('插件消息超过 256KB');
        if (current(c) && c.authed && c.ws.readyState === 1) c.ws.send(text);
        resolve();
      } catch (e) { reject(e); throw e; }
    })().catch(e => fail(c, e.message));
  });
}
function sendResult(msg) {
  const c = executions.get(msg.id);
  executions.delete(msg.id);
  if (!c || !current(c) || !c.authed || c.ws.readyState !== 1) return;
  sendSigned(c, msg.ok === true
    ? { type: 'resp', id: msg.id, ok: true, data: msg.data === undefined ? null : msg.data }
    : { type: 'resp', id: msg.id, ok: false, error: msg.error || { code: 'PLUGIN_ERROR', message: '插件未提供错误详情' } }).catch(() => {});
}

window.onmessage = event => {
  // Figma Desktop dispatches Plugin API messages from its top-level editor window.
  if (event.source !== window.top || !['https://www.figma.com', 'https://figma.com'].includes(event.origin)) return;
  const msg = event.data?.pluginMessage;
  if (!plain(msg)) return;
  if (msg.type === 'exec_result') { sendResult(msg); return; }
  if (msg.type === 'transfer_upload') {
    if (!connection || !connection.authed || connection.ws.readyState !== 1) { toMain({ type: 'transfer_upload_done', id: msg.id, ok: false, error: '连接不可用' }); return; }
    try { startUpload(connection, msg); }
    catch (e) { toMain({ type: 'transfer_upload_done', id: msg.id, ok: false, error: e.message }); }
    return;
  }
  if (msg.type === 'init' || msg.type === 'context') {
    try {
      const next = normalizeContext(msg.context);
      const changed = context && canonical(context) !== canonical(next);
      context = next;
      if (changed) detach('context changed');
      if (wantConnected) connect();
    } catch (e) { stop('invalid context', false); setState('auth_failed', e.message); }
    return;
  }
  if (msg.type === 'token') {
    if (userTouchedKey) return;
    if (typeof msg.token === 'string' && msg.token) {
      setKey(msg.token, false).catch(e => { setState('auth_failed', e.message); showPair(true); });
    } else { showPair(true); setState('waiting', '粘贴本机配对密钥后连接'); }
    return;
  }
  if (msg.type === 'saved' && msg.ok !== true) setState('authorized', '本次连接已授权，但保存配对失败；下次需重新粘贴密钥');
  if (msg.type === 'tokenCleared') {
    if (msg.ok === false) setState('auth_failed', '已断开，但清除已保存配对失败，请重试忘记配对');
    else setState('waiting', '已忘记配对；粘贴新的本机密钥后连接');
  }
};
document.getElementById('pairBtn').addEventListener('click', () => {
  userTouchedKey = true;
  const value = document.getElementById('pair').value.trim();
  document.getElementById('pair').value = '';
  detach('new pairing');
  wantConnected = true;
  setKey(value, true).catch(e => { wantConnected = false; setState('auth_failed', e.message); showPair(true); });
});
document.getElementById('connectBtn').addEventListener('click', () => {
  wantConnected = true;
  reconnectDelay = 1000;
  connect();
});
document.getElementById('disconnectBtn').addEventListener('click', () => {
  stop('user disconnect', true);
  setState('idle', '已停止本次授权；点击连接可重新授权');
});
document.getElementById('forgetBtn').addEventListener('click', () => {
  userTouchedKey = true;
  ++keyRevision;
  stop('forget pairing', true);
  token = ''; cryptoKey = null; pendingSave = false;
  document.getElementById('pair').value = '';
  showPair(true);
  toMain({ type: 'clearToken' });
  setState('waiting', '已断开，正在清除已保存配对');
});
toMain({ type: 'getToken' });
</script>
